# nginx_proxy — storefront kolortec (kolortec.com + kolortec.com.ar).
# NO copiar a conf.d hasta tener el cert emitido (referencia certs que si no
# existen rompen `nginx -t`). Flujo: 1) apuntar DNS de los 4 names al VPS,
# 2) versión HTTP-only para acme + certbot webroot (cert primario kolortec.com.ar
#    cubriendo los 4 names), 3) recién entonces esta versión SSL, nginx -t, reload.
server {
    listen 80;
    server_name kolortec.com.ar www.kolortec.com.ar kolortec.com www.kolortec.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.kolortec.com.ar www.kolortec.com kolortec.com;
    ssl_certificate /etc/letsencrypt/live/kolortec.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolortec.com.ar/privkey.pem;
    return 301 https://kolortec.com.ar$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name kolortec.com.ar;
    ssl_certificate /etc/letsencrypt/live/kolortec.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolortec.com.ar/privkey.pem;
    client_max_body_size 25m;
    location / {
        proxy_pass http://kolortec_web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
