server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones REALES (301) de las URLs viejas. Son las mismas que App.jsx resuelve con <Navigate>, pero ésas
    # responden 200 con el index.html y redirigen recién cuando corre el JS: para un buscador eso es una página
    # duplicada, no una mudanza. Con 301 la URL vieja le pasa su historial a la nueva.
    # `absolute_redirect off`: el Location sale relativo (/sumate). nginx escucha en el 80 detrás de Caddy; con un
    # Location absoluto armaría http://…:80/sumate y sacaría al visitante del https.
    # Que esta lista y la de App.jsx no se separen lo cuida scripts/check-sitemap-rutas.mjs.
    absolute_redirect off;
    # Un 301 sin Cache-Control el navegador lo guarda SIN vencimiento: si mañana una de estas rutas vuelve a ser una
    # página, quien ya pasó seguiría redirigido y no hay forma de borrárselo desde el servidor. Un día alcanza.
    # Va a nivel server: lo heredan sólo las locations que NO tienen su propio add_header, o sea, estos 301.
    add_header Cache-Control "max-age=86400" always;
    # `$is_args$args`: el 301 conserva la query (?utm=…, ?preview=<token>); sin eso se pierde en el camino.
    location = /soporte                 { return 301 /descargas$is_args$args; }
    location = /rentals                 { return 301 /sumate$is_args$args; }
    location = /distribuidores          { return 301 /sumate$is_args$args; }
    location = /politica-de-privacidad  { return 301 /privacidad$is_args$args; }
    location = /terminos-y-condiciones  { return 301 /terminos$is_args$args; }
    location = /legales                 { return 301 /terminos$is_args$args; }
    location = /home                    { return 301 /$is_args$args; }
    location = /editable                { return 301 /$is_args$args; }

    # SPA: cualquier ruta no-archivo cae a index.html (react-router del lado cliente).
    #
    # ⚠️ EL HTML NO SE CACHEA, Y ESTO NO ES OPCIONAL.
    #
    # Antes esta location no mandaba ningún Cache-Control. Sin esa cabecera el
    # navegador aplica una heurística sobre Last-Modified y se queda con el
    # index.html viejo. Y como los assets llevan hash en el nombre, ESE html
    # viejo apunta a los archivos viejos —que siguen existiendo en el servidor—
    # así que el sitio seguía mostrando el diseño anterior después de deployar,
    # indefinidamente, hasta que alguien recargaba forzado. Producción estaba
    # bien y el navegador mostraba otra cosa: el peor tipo de bug, porque no hay
    # nada roto que mirar.
    #
    # El index.html es el único archivo cuyo nombre NO cambia entre versiones:
    # es el que le dice al navegador qué assets pedir. Tiene que revalidarse
    # siempre. Es el mismo criterio que ya usa Caddy para el panel de admin.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Modelo 3D (.glb) y decodificador Draco (.wasm): el mime.types de nginx no
    # trae `glb` (saldría como application/octet-stream), así que se declaran
    # acá. Y su nombre es FIJO (no llevan hash): si se cachearan "para siempre"
    # como los assets de abajo, al actualizar el modelo el navegador seguiría
    # con el viejo. Se revalidan siempre (ETag → 304 sin re-bajar si no cambió).
    location ~* \.(?:glb|wasm)$ {
        types {
            model/gltf-binary glb;
            application/wasm wasm;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
        try_files $uri =404;
    }

    # El JS del decodificador Draco también tiene nombre fijo: mismo criterio.
    location ^~ /assets/3d/draco/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Assets con hash en el nombre: se pueden cachear PARA SIEMPRE, justamente
    # porque al cambiar el contenido cambia el nombre. `immutable` le ahorra al
    # navegador hasta la revalidación condicional.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
}
