server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta no-archivo cae a index.html (react-router del lado cliente).
    #
    # ⚠️ EL HTML NO SE CACHEA, Y ESTO NO ES OPCIONAL.
    #
    # Antes esta location no mandaba ningún Cache-Control. Sin esa cabecera el
    # navegador aplica una heurística sobre Last-Modified y se queda con el
    # index.html viejo. Y como los assets llevan hash en el nombre, ESE html
    # viejo apunta a los archivos viejos —que siguen existiendo en el servidor—
    # así que el sitio seguía mostrando el diseño anterior después de deployar,
    # indefinidamente, hasta que alguien recargaba forzado. Producción estaba
    # bien y el navegador mostraba otra cosa: el peor tipo de bug, porque no hay
    # nada roto que mirar.
    #
    # El index.html es el único archivo cuyo nombre NO cambia entre versiones:
    # es el que le dice al navegador qué assets pedir. Tiene que revalidarse
    # siempre. Es el mismo criterio que ya usa Caddy para el panel de admin.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Assets con hash en el nombre: se pueden cachear PARA SIEMPRE, justamente
    # porque al cambiar el contenido cambia el nombre. `immutable` le ahorra al
    # navegador hasta la revalidación condicional.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
}
