server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta no-archivo cae a index.html (react-router del lado cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos con cache largo.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|mp4)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
