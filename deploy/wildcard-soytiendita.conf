# Wildcard storefront — cualquier <slug>.soytiendita.store → kolortec_web.
# Onboarding self-service: una cuenta reclama su subdominio en el panel
# (account_domains) y queda activo al instante; este vhost + el cert wildcard
# lo sirven sin tocar nada por cliente.
#
# REQUISITOS antes de copiar a conf.d:
#  1) DNS: *.soytiendita.store  A  212.85.14.157
#  2) Cert wildcard *.soytiendita.store (DNS-01) en /etc/letsencrypt/live/soytiendita.store-wild/
# El apex (soytiendita.store), www y api siguen en tiendita.conf (exact match gana
# sobre este regex; el apex NO lo cubre el wildcard *.soytiendita.store).
server {
    listen 80;
    server_name ~^(?<sub>[^.]+)\.soytiendita\.store$;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name ~^(?<sub>[^.]+)\.soytiendita\.store$;
    ssl_certificate /etc/letsencrypt/live/soytiendita.store-wild/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soytiendita.store-wild/privkey.pem;
    client_max_body_size 25m;
    location / {
        proxy_pass http://kolortec_web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
