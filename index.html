<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/assets/logo_minimal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="supported-color-schemes" content="dark" />
    <!-- Anti-flash "en construcción": si la ÚLTIMA carga vio la web despublicada (y no es vista
         previa), ocultamos #root ANTES del primer paint. Sin esto se ve el sitio pre-renderizado
         un segundo y después se tapa con la página de mantenimiento. React revela #root al decidir. -->
    <script>
      (function () {
        var d = document.documentElement;

        try {
          var u = new URL(window.location.href);
          var preview = u.searchParams.get('preview') || window.sessionStorage.getItem('kt:preview');
          if (!preview && window.localStorage.getItem('kt:pub') === '0') {
            d.setAttribute('data-kt-hold', '');
          }
        } catch (e) {}

        // --- 1. No restaurar scroll -------------------------------------------------
        // El documento cambia de alto DESPUES del primer paint (llega la API y se
        // insertan N x 100vh de scrolltelling ARRIBA de todo). Con 'auto' el navegador
        // restauraba una posicion vieja sobre una altura provisoria: de ahi el
        // "aparece en otro lugar de la web y despues salta al inicio".
        try {
          if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';
        } catch (e) {}

        // --- 2. El zoom del canvas, ANTES de pintar ---------------------------------
        // Misma formula que CanvasScaler (main.jsx). Antes solo corria en un useEffect,
        // asi que el primer paint usaba zoom:1 y el efecto lo bajaba a ~0.71: el
        // documento entero se encogia ~30% de un frame al otro. Alla queda solo el resize.
        try {
          var w = window.innerWidth;
          // Misma formula que CanvasScaler (main.jsx). SIN TOPE: con Math.min(1, ...)
          // el lienzo se quedaba en 1920 arriba de ese ancho y aparecian bandas
          // negras a los costados. Si se cambia aca, cambiar alla.
          var ktScale = String(w >= 1024 ? w / 1920 : 1);
          d.style.setProperty('--kt-canvas-scale', ktScale);
          // Alias generico que lee el renderer del hero (scroll-contract.js), que es
          // compartido con el admin y el store y no puede conocer una var "kt-".
          // Va aca ademas de en CanvasScaler: si solo estuviera en el efecto, el
          // primer paint del scrolltelling calcularia el alto con escala 1.
          d.style.setProperty('--hero-viewport-scale', ktScale);
        } catch (e) {}

        // --- 3. Pantalla de carga ---------------------------------------------------
        // Tapa los reacomodos de altura que quedan. Vive aca y no en React a proposito:
        // el Dockerfile del VPS saltea el pre-render, asi que #root sale VACIO y sin
        // esto la primera pantalla es un negro pelado hasta que monta React.
        d.setAttribute('data-kt-boot', '');

        var shownAt = Date.now();
        var MIN_MS = 400;   // evita el parpadeo en conexiones rapidas
        var FADE_MS = 280;

        window.__ktHideBoot = function () {
          var el = document.getElementById('kt-boot');
          if (!el || el.getAttribute('data-leaving')) return;
          var wait = Math.max(0, MIN_MS - (Date.now() - shownAt));
          window.setTimeout(function () {
            el.setAttribute('data-leaving', '1');
            // Sacar el atributo ANTES del scrollTo: mientras esta puesto el documento
            // tiene overflow:hidden y el scroll no se moveria.
            d.removeAttribute('data-kt-boot');
            // El reset a cero es para que una carga normal empiece arriba. Pero si
            // el visitante pidio una seccion (hay hash), pisarlo lo devolvia al
            // tope: tocar SOPORTE desde otra pagina te dejaba arriba de todo, o
            // sea obligado a pasar por el scrolltelling. El salto lo hace React
            // ~antes~ de que esto corra, asi que este scrollTo lo borraba.
            try { if (!window.location.hash) window.scrollTo(0, 0); } catch (e) {}
            el.className = 'is-leaving';
            window.setTimeout(function () {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, FADE_MS);
          }, wait);
        };

        // Red de seguridad: si la API cuelga o React nunca monta, el sitio se muestra
        // igual. Mejor contenido vacio que una pantalla de carga eterna.
        window.setTimeout(function () { window.__ktHideBoot(); }, 6000);
      })();
    </script>
    <style>
      html[data-kt-hold] { background: #050505; }
      html[data-kt-hold] #root { visibility: hidden; }

      /* Mientras la pantalla de carga esta arriba, el documento no scrollea: abajo se
         estan reacomodando alturas y no queremos que el usuario pelee con eso. */
      html[data-kt-boot], html[data-kt-boot] body { overflow: hidden; }

      #kt-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #050505;
        opacity: 1;
        transition: opacity 280ms ease-out;
      }
      #kt-boot.is-leaving { opacity: 0; }

      #kt-boot img {
        width: auto;
        height: 34px;
        max-width: 62vw;
        display: block;
        animation: kt-boot-pulse 1900ms ease-in-out infinite;
      }

      #kt-boot span {
        /* system-ui a proposito: las fuentes de marca se bajan de /public/fonts y
           llegarian tarde — el texto saltaria de una tipografia a otra. */
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.38);
      }

      #kt-boot i {
        display: block;
        width: 86px;
        height: 1px;
        background: rgba(244, 223, 51, 0.16);
        overflow: hidden;
        position: relative;
      }
      #kt-boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        background: #f4df33;
        transform: translateX(-100%);
        animation: kt-boot-sweep 1400ms ease-in-out infinite;
      }

      @keyframes kt-boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.62; transform: scale(0.955); }
      }
      @keyframes kt-boot-sweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #kt-boot img { animation: none; }
        #kt-boot i::after { animation: none; transform: none; opacity: 0.5; }
      }
    </style>
  </head>
