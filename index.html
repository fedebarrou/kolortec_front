<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/assets/logo_minimal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="supported-color-schemes" content="dark" />
    <!-- Anti-flash "en construcción": si la ÚLTIMA carga vio la web despublicada (y no es vista
         previa), ocultamos #root ANTES del primer paint. Sin esto se ve el sitio pre-renderizado
         un segundo y después se tapa con la página de mantenimiento. React revela #root al decidir. -->
    <script>
      (function () {
        try {
          var u = new URL(window.location.href);
          var preview = u.searchParams.get('preview') || window.sessionStorage.getItem('kt:preview');
          if (!preview && window.localStorage.getItem('kt:pub') === '0') {
            document.documentElement.setAttribute('data-kt-hold', '');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html[data-kt-hold] { background: #050505; }
      html[data-kt-hold] #root { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
