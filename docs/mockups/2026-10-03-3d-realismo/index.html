<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolortec · 3D antes / después</title>
<style>
  @font-face { font-family: 'Manrope'; src: url('/fonts/manrope-latin.woff2') format('woff2'); font-weight: 200 900; }
  body { margin: 0; background: #141414; color: #eee; font-family: Manrope, sans-serif; }
  .top { padding: 20px 24px 8px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #f4df33; }
  .top p { margin: 0; color: #a3aab4; font-size: 14px; }
  .top button { padding: 8px 16px; border-radius: 999px; border: 0; background: #f4df33; color: #090909; font-weight: 800; cursor: pointer; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 24px 24px; }
  .cell { position: relative; background: #f4df33; height: 78vh; border-radius: 6px; overflow: hidden; }
  .cell span { position: absolute; left: 14px; top: 12px; z-index: 2; background: #090909; color: #f4df33; padding: 6px 12px; font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="top">
  <h1>HOT SPOT CMY · antes / después</h1>
  <p>Misma luz, misma cámara y mismo fondo que el sitio. Arrastrá para girar; el botón abre/cierra los dos a la vez.</p>
  <button id="toggle">Desarmar</button>
</div>
<div class="grid">
  <div class="cell"><span>Antes (actual)</span><canvas id="a"></canvas></div>
  <div class="cell"><span>Después (modelo v4 + sin moiré + sombra de apoyo)</span><canvas id="b"></canvas></div>
</div>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'

const DIR = new THREE.Vector3(0.55, 0.32, 1).normalize()
const R = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), DIR).normalize()
let abierto = 0
let meta = 0
const visores = []

async function visor(canvas, glbUrl, piezasUrl, mejoras = false) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true })
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
  renderer.outputColorSpace = THREE.SRGBColorSpace
  renderer.toneMapping = THREE.ACESFilmicToneMapping
  renderer.toneMappingExposure = 1.15
  renderer.shadowMap.enabled = true
  const scene = new THREE.Scene()
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture
  scene.environmentIntensity = 0.55
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 50)
  const key = new THREE.SpotLight(0xffffff, 26, 8, Math.PI / 7, 0.55, 1.4); key.castShadow = true
  const fill = new THREE.DirectionalLight(0xcfd8ff, 0.55)
  const back = new THREE.SpotLight(0xffffff, 18, 8, Math.PI / 9, 0.6, 1.4)
  scene.add(key, key.target, fill, back, back.target)
  const loader = new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('/assets/3d/draco/'))
  const [gltf, piezas] = await Promise.all([loader.loadAsync(glbUrl), fetch(piezasUrl).then(r => r.json())])
  const m = gltf.scene; scene.add(m)
  m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true } })
  if (mejoras) {
    // 1) Filtrado anisotrópico: saca el moiré (rayas) del grano de la carcasa.
    const aniso = renderer.capabilities.getMaxAnisotropy()
    m.traverse(o => { if (!o.isMesh) return; for (const mat of [].concat(o.material)) { for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap']) if (mat[k]) { mat[k].anisotropy = aniso; mat[k].needsUpdate = true } } })
  }
  const box = new THREE.Box3().setFromObject(m); const s = box.getBoundingSphere(new THREE.Sphere())
  const c = s.center, r = s.radius
  key.position.set(c.x + r * .5, c.y + r * 3.2, c.z + r * 1.4); key.target.position.copy(c)
  if (mejoras) {
    // 3) Sin "shadow acne": las rayas finas en la carcasa curva eran la propia
    //    sombra pintándose sobre sí misma. normalBias la despega de la superficie.
    key.shadow.bias = -0.0002
    key.shadow.normalBias = r * 0.02
    key.shadow.mapSize.set(2048, 2048)
  }
  fill.position.set(c.x - r * 2, c.y + r, c.z + r * 2)
  back.position.set(c.x - r * .4, c.y + r * .2, c.z - r * 2.6); back.target.position.set(c.x, c.y + r * .55, c.z)
  if (mejoras) {
    // 2) Sombra de contacto bajo la base: el equipo APOYA, no flota.
    const cv = document.createElement('canvas'); cv.width = cv.height = 128
    const g = cv.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64)
    gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128)
    const sombra = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }))
    sombra.rotation.x = -Math.PI / 2
    sombra.position.set(c.x, box.min.y + 0.001, c.z)
    sombra.scale.set(r * 1.25, r * 0.95, 1)
    scene.add(sombra)
  }
  const info = new Map(piezas.map(p => [p.nombre_objeto, p]))
  const nodos = []
  m.traverse(o => {
    const n = o.userData?.pieza || o.name
    const p = info.get(n)
    if (!p || !p.despiece?.orden || nodos.find(x => x.n === n)) return
    const off = new THREE.Vector3().fromArray(p.despiece.direccion).normalize().multiplyScalar((p.despiece.distancia || .15) * .75)
    off.addScaledVector(R, off.dot(R) * ((p.despiece.orden <= 2 ? 1.8 : 1.3) - 1))
    nodos.push({ n, o, base: o.position.clone(), off })
  })
  const q = new THREE.Quaternion()
  let giro = 0, arr = null
  canvas.addEventListener('pointerdown', e => { arr = e.clientX })
  addEventListener('pointerup', () => { arr = null })
  addEventListener('pointermove', e => { if (arr !== null) { giro += (e.clientX - arr) * .01; arr = e.clientX; visores.forEach(v => v.set(giro)) } })
  const v = {
    set: (g) => { giro = g },
    frame: (t) => {
      const w = canvas.clientWidth, h = canvas.clientHeight
      if (canvas.width !== Math.round(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix() }
      m.rotation.y = giro + Math.sin(t / 2600) * .25
      m.updateMatrixWorld(true)
      for (const d of nodos) {
        q.setFromRotationMatrix(d.o.parent.matrixWorld).invert().multiply(new THREE.Quaternion().setFromRotationMatrix(m.matrixWorld))
        d.o.position.copy(d.base).addScaledVector(d.off.clone().applyQuaternion(q), abierto)
      }
      const dist = r / Math.sin(THREE.MathUtils.degToRad(15)) * (abierto > .01 ? 1.15 : .9)
      cam.position.copy(c).addScaledVector(DIR, dist); cam.lookAt(c)
      renderer.render(scene, cam)
    },
  }
  visores.push(v)
}

await Promise.all([
  visor(document.getElementById('a'), '/assets/3d/hotspot-cmy.glb', '/assets/3d/hotspot-cmy.piezas.json'),
  visor(document.getElementById('b'), '/docs/3d/hotspot-cmy/out/hotspot-cmy-v4.glb', '/docs/3d/hotspot-cmy/out/piezas.json', true),
])
document.getElementById('toggle').onclick = (e) => { meta = meta ? 0 : 1; e.target.textContent = meta ? 'Armar' : 'Desarmar' }
const loop = (t) => { abierto += (meta - abierto) * .06; visores.forEach(v => v.frame(t)); requestAnimationFrame(loop) }
requestAnimationFrame(loop)
</script>
</body>
</html>
